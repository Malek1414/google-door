<svg xmlns="http://www.w3.org/2000/svg" width="256" height="232" viewBox="0 0 256 232" shape-rendering="crispEdges" role="img" aria-label="Doorway: a pixel map pin with a face hopping down to the flat threshold of an arched doorway">
<style>
  :root { --frame: #1a5fd0; --way: #1e8e3e; --pin: #c5221f; --step: #c28f00; --ink: #1f2328; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --frame: #6c9ef8; --way: #3fbf6b; --pin: #f2665c; --step: #fbc531; --ink: #0d1117; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-frame { fill: var(--frame); } .c-way { fill: var(--way); } .c-pin { fill: var(--pin); } .c-step { fill: var(--step); } .c-ink { fill: var(--ink); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-pin { transform-box: fill-box; transform-origin: center; animation: m-pin .9s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes m-pin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(24px); } }
  .g-way { transform-box: fill-box; transform-origin: center; animation: m-way 2.4s ease-in-out infinite; }
  @keyframes m-way { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-pin, .g-way { animation: none; } }
</style>
