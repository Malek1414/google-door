name: Doorway
options:
  bundleIdPrefix: com.malek
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
# ARCore Geospatial for the native Live View (Sources/ArLiveView*.swift). Pinned to one
# release: the SDK talks to a Google service, so an update is a deliberate step.
packages:
  ARCore:
    url: https://github.com/google-ar/arcore-ios-sdk
    exactVersion: 1.56.0
targets:
  Doorway:
    type: application
    platform: iOS
    sources: [Doorway/Sources, Doorway/Resources]
    # Doorway.xcconfig includes the optional, gitignored Secrets.xcconfig (ARCORE_API_KEY).
    configFiles:
      Debug: Doorway.xcconfig
      Release: Doorway.xcconfig
    dependencies:
      - package: ARCore
        product: ARCoreGeospatial
      - package: ARCore
        product: ARCoreGARSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malek.doorway
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Doorway/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "AHU398M2XY"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ARCore ships its Geospatial methods as Objective-C categories in static libraries.
        # Without -ObjC the linker drops them and the first createAnchor call crashes with
        # "unrecognized selector".
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
